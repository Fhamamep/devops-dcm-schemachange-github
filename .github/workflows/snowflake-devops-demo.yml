name: schemachange deploy

on:
  push:
    branches: [main]
    paths: ['migrations/**']     # only run when a migration changes
  workflow_dispatch:             # adds a "Run workflow" button

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # get the repo files onto the runner

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: pip install schemachange

      - name: Write private key to a temp file
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/rsa_key.p8"

      - name: Deploy
        env:
          SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:             ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE:             ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE:        ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:         ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_AUTHENTICATOR:    snowflake_jwt
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ runner.temp }}/rsa_key.p8
        run: |
          schemachange deploy \
            --root-folder migrations \
            --change-history-table DEMO_DB.SCHEMACHANGE.CHANGE_HISTORY \
            --create-change-history-table
