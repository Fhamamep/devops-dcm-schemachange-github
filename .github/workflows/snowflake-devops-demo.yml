name: schemachange deploy

on:
  push:
    branches: [dev, main]                 # dev → DEV, main → PROD
    paths:
      - 'migrations/**'
      - '.github/workflows/**'            # also deploy when the pipeline itself changes
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: pip install schemachange==4.4.0

      - name: Write private key to a temp file
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/rsa_key.p8"

      - name: Deploy
        env:
          SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:             ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE:             ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE:        ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:         ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_AUTHENTICATOR:    snowflake_jwt
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ runner.temp }}/rsa_key.p8
        run: |
          schemachange deploy \
            --root-folder migrations \
            --change-history-table ${{ vars.SNOWFLAKE_DATABASE }}.SCHEMACHANGE.CHANGE_HISTORY \
            --create-change-history-table